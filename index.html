<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toko Benang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #8a5a32; --wood-dark: #5c3c1d; --wood-light: #c8955e;
    --cream: #fff8ee; --ink: #3b2a1a; --green: #2f8f4e; --red: #d64545; --amber: #e08a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; color: var(--ink);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: repeating-linear-gradient(90deg, #f3e4cc 0 22px, #f8ecd9 22px 44px);
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: linear-gradient(#7a4d29, #5c3c1d); color: var(--cream);
    box-shadow: 0 3px 0 #3f2812;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; margin-right: auto; }
  .logo .yarn { width: 34px; height: 34px; }
  .pill { position: relative; background: #00000033; padding: 4px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .pill b { font-size: 16px; }
  .pill.bump { animation: bump .4s; }
  @keyframes bump { 40% { transform: scale(1.2); background: #f2b63288; } }
  .float { position: absolute; right: 4px; top: 0; color: #ffe066; font-weight: 700; pointer-events: none; animation: floatUp 1.2s ease-out forwards; }
  @keyframes floatUp { to { transform: translateY(-34px); opacity: 0; } }
  #musicBtn, #muteBtn { background: #00000033; border: 0; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; color: var(--cream); }
  #musicBtn svg, #muteBtn svg { width: 20px; height: 20px; }
  @media (max-width: 600px) {
    #hud { gap: 6px; padding: 8px 10px; }
    .logo span { display: none; }
    .pill { font-size: 11px; padding: 3px 7px; } .pill b { font-size: 13px; }
    #musicBtn, #muteBtn { width: 32px; height: 32px; flex-shrink: 0; }
  }

  main {
    flex: 1; min-height: 0; width: 100%; max-width: 1500px; margin: 0 auto;
    display: grid; grid-template-columns: 240px 1fr; gap: 12px; padding: 12px;
  }

  /* ---------- area pelanggan (meja kasir) ---------- */
  #counter {
    position: relative; overflow: hidden; border-radius: 18px; min-height: 0;
    display: flex; flex-direction: column;
    background: linear-gradient(#e3f4ef, #f7efe6); box-shadow: 0 4px 0 #0000001a, 0 6px 16px #0000001a;
  }
  #bubble {
    position: relative; z-index: 3; margin: 14px 14px 0; padding: 12px 14px; border-radius: 16px;
    background: #fff; box-shadow: 0 4px 0 #e6d3bd, 0 6px 14px #7a5c4422; font-size: 15px; transform-origin: 50% 100%;
    visibility: hidden; opacity: 0;
  }
  #bubble.show { visibility: visible; opacity: 1; animation: bubbleIn .4s cubic-bezier(.3,1.6,.5,1); }
  #bubble::after {
    content: ""; position: absolute; bottom: -14px; left: 50%; margin-left: -10px;
    border: 11px solid transparent; border-bottom: 0; border-top-color: #fff;
  }
  @keyframes bubbleIn { from { transform: scale(.3); opacity: 0; } }
  .order { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .order li { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 8px; transition: background .2s; }
  .order li .yarn { width: 32px; height: 32px; }
  .order li span { flex: 1; font-weight: 600; }
  .order li .check { width: 22px; height: 22px; color: var(--green); opacity: 0; }
  .order li.done { background: #e4f4e8; }
  .order li.done span { text-decoration: line-through; opacity: .6; }
  .order li.done .check { opacity: 1; animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
  #reply { margin-top: 6px; font-size: 13px; color: var(--red); min-height: 1.2em; }
  #reply.good { color: var(--green); }

  #custWrap { position: relative; z-index: 1; flex: 1; min-height: 110px; max-height: 230px; margin-top: auto; display: flex; justify-content: center; align-items: flex-end; }
  #customer { height: 100%; display: flex; align-items: flex-end; }
  #customer svg { width: auto; height: 100%; max-height: 226px; display: block; filter: drop-shadow(0 6px 6px #7a5c4426); transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px) scaleY(.985); } }
  #custWrap.enter { animation: enter .65s cubic-bezier(.3,1.2,.5,1) both; }
  #custWrap.leave { animation: leave .5s ease-in both; }
  @keyframes enter { from { transform: translateX(-150%); } }
  @keyframes leave { to { transform: translateX(150%); } }
  #custWrap.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  #closedSign {
    position: absolute; left: 50%; top: 90px; transform: translateX(-50%) rotate(-3deg); z-index: 1;
    background: #fff6ec; color: var(--ink); padding: 10px 18px; border-radius: 12px; font-weight: 600;
    box-shadow: 0 4px 0 #f0d9c2; white-space: nowrap;
  }
  #closedSign::before { content: ""; position: absolute; left: 50%; top: -30px; width: 2px; height: 30px; background: var(--wood-dark); }

  .counterTop {
    position: relative; z-index: 2; margin-top: -34px; padding: 14px 16px 16px;
    background: linear-gradient(#f3c9a8, #e9b58f); border-top: 10px solid #f9dcc4; color: var(--ink);
  }
  #timerBar { height: 16px; background: #ffffff8c; border-radius: 8px; overflow: hidden; }
  #timerFill { height: 100%; width: 100%; background: #5cc46a; border-radius: 8px; transition: width .1s linear, background .3s; }
  #timerFill.low { animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.4); } }
  #timerText { margin-top: 6px; font-size: 14px; font-weight: 600; text-align: center; }

  .confetti { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 5; pointer-events: none; animation: fall 1.7s ease-in forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 520px) rotate(var(--r)); opacity: .6; } }

  /* ---------- area rak ---------- */
  #stage {
    min-width: 0; min-height: 0; display: flex; flex-direction: column;
    background: #fffaf2; border-radius: 18px; padding: 12px; box-shadow: 0 4px 0 #0000001a, 0 6px 16px #0000001a;
  }
  #hint { font-size: 14px; margin-bottom: 8px; color: #8a6d50; font-weight: 500; }
  #view { flex: 1; min-height: 0; overflow: auto; }
  /* Ukuran benang (--ys) dan teks (--fs) dihitung otomatis oleh fitRacks() supaya semua rak muat tanpa scroll */
  #view.racks { display: grid; gap: 8px; align-items: start; overflow: hidden; --ys: 44px; --fs: 11px; }
  .shelfRack {
    min-width: 0; border-radius: 10px; padding: 6px;
    background: #ecd3b0;
    display: grid; gap: 6px; align-content: start; box-shadow: inset 0 0 0 4px #e0c299, 0 4px 0 #cfaa7e;
  }
  .shelfRack h3 {
    margin: 0 auto; padding: 1px 10px; border-radius: 6px; text-align: center; font-size: 13px; line-height: 18px;
    background: var(--cream); color: var(--ink); box-shadow: 0 2px 0 #0003;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shelf {
    background: #fff6ec; border-radius: 8px; padding: 4px 3px 0;
    border-bottom: 6px solid #e2c39c; display: flex; justify-content: space-around; gap: 2px;
    box-shadow: inset 0 4px 6px #c9a47a33;
  }
  .item {
    border: 0; background: transparent; color: #7a5c44; font-weight: 500; padding: 2px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    font-size: var(--fs); line-height: 1.2; flex: 1 1 0; min-width: 0; transition: background .15s;
  }
  .item .nm { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #fff; }
  .item:hover .yarn { animation: wiggle .45s; }
  .item .yarn { width: var(--ys); height: var(--ys); }
  @keyframes wiggle { 25% { transform: rotate(-10deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
  .fresh .item { animation: itemIn .45s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d); }
  @keyframes itemIn { from { transform: scale(0) translateY(20px); opacity: 0; } }

  .yarn { display: block; width: 72px; height: 72px; flex-shrink: 0; overflow: visible; filter: drop-shadow(0 3px 3px #7a5c4430); }
  @keyframes pop { from { transform: scale(.2); } 70% { transform: scale(1.12); } to { transform: scale(1); } }

  /* ---------- kasir ---------- */
  .register { display: grid; gap: 12px; max-width: 680px; margin: 0 auto; }
  .register.fresh { animation: cardIn .35s cubic-bezier(.3,1.4,.5,1); }
  .lcd {
    background: #1d2a1f; border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    font-family: "Courier New", monospace; color: #8dff9a; box-shadow: inset 0 0 0 4px #3a4a3a, 0 4px 0 #0003;
    text-shadow: 0 0 6px #8dff9a88;
  }
  .lcd div { display: flex; flex-direction: column; min-width: 0; }
  .lcd span { font-size: 11px; opacity: .7; }
  .lcd b { font-size: 20px; }
  .lcd .hl b { color: #ffe066; text-shadow: 0 0 6px #ffe06688; }
  @media (max-width: 600px) { .lcd b { font-size: 14px; } }
  .paidRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #f3e6d2; border-radius: 12px; padding: 10px 14px; }
  .bought { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .bought div { display: flex; align-items: center; gap: 4px; }
  .bought .yarn { width: 28px; height: 28px; }
  .label { font-size: 13px; color: #8a6d50; font-weight: 500; }
  .tray {
    min-height: 78px; background: #fff6ec; border-radius: 12px; padding: 10px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: inset 0 3px 8px #0002;
  }
  .tray:empty::before { content: "Belum ada uang kembalian"; color: #9c8566; font-size: 13px; }
  .cashDrawer {
    background: #ecd3b0; border-radius: 12px; padding: 12px;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; box-shadow: inset 0 0 0 4px #e0c299;
  }
  .payActions { display: flex; gap: 10px; justify-content: flex-end; }

  /* Kasir di HP: ringkas supaya TOTAL/DIBAYAR dan tombol Serahkan muat satu layar tanpa scroll */
  @media (max-width: 640px) {
    .register { gap: 8px; }
    .lcd { padding: 8px 10px; gap: 4px; }
    .lcd span { font-size: 10px; }
    .lcd b { font-size: 15px; }
    .paidRow { padding: 6px 10px; }
    .paidRow .bought { display: none; }
    .paidRow::before { content: "Uang dari pelanggan:"; font-size: 13px; color: #8a6d50; }
    .label { display: none; }
    .tray { min-height: 54px; padding: 6px; gap: 6px; }
    .cashDrawer { padding: 8px; gap: 6px; }
    .money.note { width: 76px; height: 40px; padding: 0 7px; }
    .money.note i { width: 20px; height: 20px; margin-top: -10px; left: 6px; }
    .money.note span { font-size: 14px; }
    .money.note small { font-size: 6px; letter-spacing: 1px; }
    .money.coin { width: 42px; height: 42px; font-size: 10px; }
    .payActions .btn { padding: 12px 10px; }
    .payActions .btn.ghost { flex: 1; }
    .payActions .btn.go { flex: 2; }
  }

  .money { border: 0; position: relative; color: #1d1d1d; font-weight: 700; flex-shrink: 0; transition: transform .12s; font-family: inherit; }
  .money.note {
    width: 104px; height: 54px; border-radius: 6px; padding: 0 10px; overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    background: linear-gradient(135deg, #ffffff66, transparent 60%), var(--m);
    box-shadow: inset 0 0 0 3px #ffffff77, 0 2px 4px #0004;
  }
  .money.note i { position: absolute; left: 8px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; border: 2px solid #ffffff99; background: #ffffff33; }
  .money.note span { font-size: 17px; }
  .money.note small { font-size: 8px; letter-spacing: 2px; opacity: .7; }
  .money.coin {
    width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
    background: radial-gradient(circle at 35% 30%, #ffffffaa, transparent 50%), var(--m);
    box-shadow: inset 0 0 0 4px #00000022, inset 0 0 0 7px #ffffff55, 0 2px 4px #0004;
  }
  button.money:hover { transform: translateY(-3px) rotate(-3deg); }
  button.money:active { transform: scale(.94); }
  .drop { animation: drop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes drop { from { transform: translateY(-50px) scale(1.3); opacity: 0; } }
  .handover { animation: handover .7s cubic-bezier(.3,1.4,.5,1); }
  @keyframes handover { from { transform: translateX(-160px) rotate(-25deg); opacity: 0; } }

  /* ---------- tombol ---------- */
  .btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 16px; transition: transform .1s; }
  .btn:active { transform: translateY(2px); }
  .btn.go { background: var(--green); color: #fff; box-shadow: 0 4px 0 #1f6636; }
  .btn.ghost { background: #eadcc6; color: var(--ink); box-shadow: 0 4px 0 #cdb998; }

  /* ---------- hasil per pelanggan ---------- */
  .result { text-align: center; padding: 36px 10px; animation: cardIn .3s; }
  .stamp {
    display: inline-block; font-size: 38px; font-weight: 700; letter-spacing: 2px; padding: 6px 22px;
    border: 5px solid currentColor; border-radius: 14px; transform: rotate(-6deg);
    animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes stamp { from { transform: rotate(-6deg) scale(3); opacity: 0; } }
  .result.ok .stamp { color: var(--green); }
  .result.late .stamp { color: var(--amber); }
  .result.bad .stamp { color: var(--red); }
  .result .pts { font-size: 44px; font-weight: 700; color: var(--green); margin: 10px 0; animation: pop .5s .3s both; }
  .result.bad .pts { color: var(--red); }

  /* ---------- overlay ---------- */
  #overlay { position: fixed; inset: 0; background: #2a1a0ccc; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #overlay[hidden] { display: none; }
  #overlayBox {
    background: var(--cream); border-radius: 22px; padding: 26px; max-width: 470px; width: 100%; text-align: center;
    box-shadow: 0 8px 0 #0004; animation: cardIn .35s cubic-bezier(.3,1.4,.5,1); max-height: calc(100vh - 32px); overflow: auto;
  }
  #overlayBox h2 { margin: 0 0 10px; font-size: 28px; }
  @keyframes cardIn { from { transform: translateY(30px) scale(.92); opacity: 0; } }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .legend { display: flex; justify-content: center; gap: 12px; margin: 14px 0; font-size: 12px; }
  .legend div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .legend .yarn { width: 54px; height: 54px; }
  .bigLogo { width: 110px; height: 110px; margin: 0 auto 6px; animation: bob 2.4s ease-in-out infinite; }

  .zoomStage { position: relative; width: 240px; height: 240px; margin: 0 auto; }
  .rays {
    position: absolute; inset: -20px; border-radius: 50%; animation: spin 10s linear infinite;
    background: repeating-conic-gradient(#ffd166aa 0 10deg, transparent 10deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .zoomStage .yarn { position: absolute; inset: 30px; width: 180px; height: 180px; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .wowTag {
    position: absolute; top: 8px; right: -6px; background: #ff5d73; color: #fff; font-weight: 700; font-size: 22px;
    padding: 4px 14px; border-radius: 999px; transform: rotate(12deg); box-shadow: 0 3px 0 #b8344a;
    animation: wowIn .4s .2s cubic-bezier(.3,1.8,.5,1) both;
  }
  @keyframes wowIn { from { transform: rotate(12deg) scale(0); } }
  .price { font-size: 20px; font-weight: 600; color: var(--wood); }

  /* Layar sempit: pelanggan jadi strip di atas (karakter kiri, balon kanan), rak dapat lebar penuh */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 8px; gap: 8px; }
    #counter {
      display: grid; grid-template-columns: 120px 1fr; grid-template-rows: 1fr auto;
      grid-template-areas: "cust bubble" "timer timer"; min-height: 150px;
    }
    #custWrap { grid-area: cust; height: 120px; min-height: 0; align-self: end; }
    #bubble { grid-area: bubble; align-self: center; margin: 8px 10px 8px 4px; padding: 8px 10px; font-size: 13px; }
    #bubble::after {
      bottom: auto; top: 50%; left: -14px; margin: -10px 0 0;
      border: 11px solid transparent; border-left: 0; border-right-color: #fff;
    }
    .order { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .order li .yarn { width: 24px; height: 24px; }
    .counterTop { grid-area: timer; margin-top: 0; padding: 6px 12px 8px; border-top-width: 6px; display: flex; align-items: center; gap: 12px; }
    #timerBar { flex: 1; }
    #timerText { margin-top: 0; font-size: 12px; min-width: 70px; text-align: right; }
    #closedSign { top: 50%; margin-top: -40px; }
  }

  /* tab rak (HP) */
  #hint:has(.tabs) { margin-bottom: 0; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    flex: 1; min-width: 0; border: 0; padding: 8px 2px; border-radius: 10px 10px 0 0;
    background: #eadcc6; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.hookTab { background: #dcbc8c; }
  .tab.on { background: #ecd3b0; color: var(--ink); }
  .tabbed .shelfRack { border-top-left-radius: 0; border-top-right-radius: 0; }
  .tabbed .shelfRack h3 { display: none; }
  .tabbed .item { font-size: 13px; }
  .shelfRack.slide { animation: slideIn .25s ease-out; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }

  /* papan hakpen */
  .shelfRack.pegboard {
    background: radial-gradient(circle, #c9a47a 2px, transparent 2.6px) 0 0 / 16px 16px, #f1dcbb;
    box-shadow: inset 0 0 0 4px #e0c299, 0 4px 0 #cfaa7e;
  }
  .pegboard .shelf { background: transparent; box-shadow: none; border-bottom: 0; padding: 4px 3px 0; gap: 4px; }
  .pegboard .item { color: var(--ink); font-weight: 600; background: #fff8eee6; box-shadow: 0 2px 0 #0002; }
  .pegboard .item:hover { background: #fff; }
  .mm { display: inline-block; background: var(--c); color: #fff; font-weight: 500; border-radius: 999px; padding: 0 .5em; line-height: 1.35; }
  .pegboard .item .nm.mm { font-size: calc(var(--fs) + 3px); padding: 1px .6em; margin-top: 2px; }

  /* VIP, combo, rekor */
  #bubble.vip { border-color: #d4a017; background: #fffbea; box-shadow: 0 0 0 4px #f2b63255; }
  .vipTag { display: table; background: #f2b632; color: var(--ink); font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; }
  .pill.combo { background: #ff5d73; }
  .pill[hidden] { display: none; }
  .badges { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
  .badge { font-weight: 700; padding: 4px 12px; border-radius: 999px; color: #fff; animation: pop .4s .5s both; }
  .badge.combo { background: #ff5d73; }
  .badge.vip { background: #d4a017; }
  .newRecord { display: inline-block; background: #ff5d73; color: #fff; font-weight: 700; padding: 4px 14px; border-radius: 999px; transform: rotate(-4deg); animation: pop .5s 1s both; }
  .best { font-size: 14px; color: #8a6d50; }

  .stars { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
  .star { width: 52px; height: 52px; fill: #e0d2bd; }
  .star.on { fill: #f2b632; animation: pop .5s cubic-bezier(.3,1.8,.5,1) both; }
  .final { font-size: 44px; font-weight: 700; color: var(--green); }
  .log { text-align: left; font-size: 14px; max-height: 220px; overflow: auto; display: grid; gap: 4px; margin-top: 10px; }
  .log div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 8px; background: #f3e6d2; }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .tag.ok { background: var(--green); } .tag.late { background: var(--amber); } .tag.bad { background: var(--red); }
</style>
</head>
<body>

<header id="hud">
  <div class="logo" id="logo"></div>
  <span class="pill">Level <b id="lvl">-</b></span>
  <span class="pill">Pelanggan <b id="cust">-</b></span>
  <span class="pill combo" id="comboPill" hidden>Combo <b id="combo">0</b></span>
  <span class="pill" id="scorePill">Skor <b id="score">0</b></span>
  <button id="musicBtn" onclick="toggleMusic()" aria-label="Lagu"></button>
  <button id="muteBtn" onclick="toggleMute()" aria-label="Efek suara"></button>
</header>
<main>
  <aside id="counter">
    <div id="bubble"><div id="request"></div><div id="reply"></div></div>
    <div id="closedSign">Menunggu pelanggan…</div>

<script>
// ================== KONFIGURASI (gampang diubah) ==================
const COLORS = [
  ['Merah', '#d62f2f'], ['Biru', '#2f6fd6'], ['Kuning', '#f2c230'], ['Hijau', '#3aa04a'],
  ['Ungu', '#8a4fc2'], ['Pink', '#f07fb0'], ['Oranye', '#f08a2a'], ['Coklat', '#8b5a2b'],
  ['Hitam', '#2a2a2a'], ['Putih', '#f4f1ea'], ['Abu-abu', '#9a9a9a'], ['Tosca', '#2bb3a8'],
  ['Krem', '#e8d6b0'], ['Navy', '#1f2f5c'],
];
const TYPES = [
  { name: 'Katun', price: 6000 },
  { name: 'Akrilik', price: 4500 },
  { name: 'Milk Cotton', price: 8500 },
  { name: 'Wol', price: 12000 },
];
// Tiap level:
//   racks/shelves/perShelf = jumlah rak, tingkat per rak, benang per tingkat
//   types     = berapa jenis benang yang dipakai (urut dari atas daftar TYPES)
//   hooks     = jumlah hakpen di papan hakpen
//   hookChance = peluang pelanggan ikut minta hakpen
//   customers = jumlah pelanggan
//   minItems/maxItems = berapa benang yang diminta satu pelanggan
//   time      = detik untuk pelanggan yang minta 1 benang, + timePerExtra untuk tiap benang tambahan
const LEVELS = [
  { racks: 3, shelves: 4, perShelf: 2, types: 2, hooks: 4, hookChance: .3, customers: 4, minItems: 1, maxItems: 2, time: 45 },
  { racks: 4, shelves: 4, perShelf: 2, types: 3, hooks: 6, hookChance: .4, customers: 4, minItems: 1, maxItems: 3, time: 40 },
  { racks: 4, shelves: 6, perShelf: 2, types: 4, hooks: 8, hookChance: .5, customers: 4, minItems: 2, maxItems: 3, time: 35 },
];
const TIME_PER_EXTRA = 15;
// Hakpen: bahan × ukuran. Hakpen aluminium warna gagangnya sesuai ukuran (seperti aslinya).
const HOOK_SIZES = [2, 3, 4, 5, 6]; // mm
const HOOK_MATERIALS = [{ name: 'Aluminium', price: 8000 }, { name: 'Bambu', price: 6000 }];
const HOOK_COLORS = { 2: '#e05252', 3: '#f0a030', 4: '#4caf50', 5: '#3d85c6', 6: '#9b59b6' };
// Hook supaya ketagihan
const VIP = { chance: .2, timeFactor: .75, mult: 2 };   // pelanggan VIP: waktu lebih singkat, poin x2
const COMBO = { step: .5, max: 3 };                      // tiap sukses beruntun: x1.5, x2, ... maks x3
const BEST_KEY = 'tokoBenang.best';
const SCORE = { onTimeBase: 100, perSecondLeft: 2, late: 50, wrongChange: 0 };
// Uang: koin untuk 500 & 1.000, sisanya lembaran (warna mirip rupiah asli)
const MONEY = {
  500: { kind: 'coin', c: '#d9b65a' }, 1000: { kind: 'coin', c: '#c9ccd1' },
  2000: { kind: 'note', c: '#a7b0b8' }, 5000: { kind: 'note', c: '#c39a6b' },
  10000: { kind: 'note', c: '#a98bd0' }, 20000: { kind: 'note', c: '#7fbf8e' },
  50000: { kind: 'note', c: '#6f9fd6' }, 100000: { kind: 'note', c: '#e07b7b' },
};
const CHANGE_NOTES = [500, 1000, 2000, 5000, 10000, 20000, 50000];
const PAY_NOTES = [5000, 10000, 20000, 50000, 100000];

// Penampilan pelanggan diacak dari daftar ini
const SKINS = ['#f6d5b8', '#eabf98', '#c98e62', '#8d5a3b'];
const HAIRS = ['#2b1d14', '#5a3a22', '#151515', '#9c4f2a', '#bdbdbd'];
const STYLES = ['short', 'long', 'bun', 'curly', 'hijab'];
const SHIRTS = ['#e07a5f', '#3d85c6', '#81b29a', '#f2cc8f', '#9b72cf', '#e5989b', '#577590', '#c44569'];

// ================== HELPER ==================
const $ = s => document.querySelector(s);
const ABC = 'ABCDEFGH';
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const pick = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (a, b, step) => { const r = []; for (let x = a; x <= b; x += step) r.push(x); return r; };
const itemName = it => it.kind === 'hook' ? `Hakpen ${it.material} ${it.size} mm` : `${it.type} ${it.color}`;
const sum = a => a.reduce((x, y) => x + y, 0);
const CHECK_SVG = `<svg class="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ================== SUARA (dibuat langsung dengan Web Audio, tanpa file) ==================
const Sound = (() => {
  let ctx = null, muted = false;
  const ac = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, dur, { type = 'sine', vol = .2, at = 0, slide = null } = {}) {
    const c = ac(), t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, { vol = .15, at = 0, freq = 2500, q = 1 } = {}) {
    const c = ac(), t = c.currentTime + at;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }
  const arp = (notes, step, opts) => notes.forEach((f, i) => tone(f, opts.dur || .18, { ...opts, at: i * step }));
  const sfx = {
    click:   () => tone(660, .06, { type: 'triangle', vol: .12 }),
    bell:    () => { tone(1318, .6, { vol: .14 }); tone(1760, .7, { vol: .1, at: .14 }); },
    wow:     () => arp([523, 659, 784, 1046], .055, { type: 'triangle', vol: .12, dur: .2 }),
    collect: () => { tone(880, .1, { type: 'triangle', vol: .15 }); tone(1320, .18, { type: 'triangle', vol: .15, at: .08 }); },
    wrong:   () => { tone(220, .16, { type: 'square', vol: .07 }); tone(165, .25, { type: 'square', vol: .07, at: .14 }); },
    note:    () => noise(.12, { vol: .2, freq: 3500, q: .8 }),
    coin:    () => { tone(1900, .08, { type: 'triangle', vol: .12 }); tone(2500, .2, { type: 'triangle', vol: .1, at: .05 }); },
    remove:  () => tone(520, .09, { type: 'triangle', vol: .09, slide: 300 }),
    tick:    () => tone(1100, .035, { type: 'square', vol: .035 }),
    angry:   () => { tone(180, .35, { type: 'sawtooth', vol: .07, slide: 110 }); },
    success: () => { noise(.09, { vol: .25, freq: 6000 }); tone(1568, .12, { type: 'triangle', vol: .14, at: .05 }); tone(2093, .5, { type: 'triangle', vol: .14, at: .14 }); },
    fail:    () => arp([392, 330, 262], .14, { type: 'sawtooth', vol: .06, dur: .22 }),
    level:   () => arp([523, 659, 784, 1046, 784, 1046], .1, { type: 'triangle', vol: .12, dur: .2 }),
    combo:   n => arp([660, 830, 990, 1320].map(f => f * (1 + .06 * n)), .05, { type: 'triangle', vol: .11, dur: .16 }),
    vip:     () => arp([784, 988, 1175, 1568], .08, { type: 'triangle', vol: .1, dur: .25 }),
    record:  () => arp([523, 659, 784, 1046, 1318, 1568], .09, { type: 'triangle', vol: .12, dur: .3 }),
    end:     () => arp([392, 523, 659, 784, 659, 784, 1046], .13, { type: 'triangle', vol: .13, dur: .26 }),
  };
  // ---------- Lagu latar: chiptune riang C – Am – F – G, diputar berulang ----------
  // Angka = nada MIDI (60 = C tengah), 0 = jeda. Tiap baris = 1 birama (8 ketukan setengah).
  const MELODY = [
    [76, 0, 79, 0, 81, 79, 76, 0], [72, 0, 76, 74, 72, 0, 69, 0],
    [77, 0, 76, 0, 74, 72, 74, 0], [74, 76, 79, 0, 76, 0, 74, 0],
    [79, 0, 81, 79, 76, 0, 79, 0], [81, 0, 79, 76, 72, 0, 74, 76],
    [77, 76, 74, 72, 69, 0, 72, 0], [71, 0, 74, 0, 72, 0, 0, 0],
  ];
  const BASS = [48, 45, 41, 43];
  const CHORDS = [[60, 64, 67], [57, 60, 64], [57, 60, 65], [55, 59, 62]];
  const BASS_PATTERN = [0, null, 7, null, 12, null, 7, null];
  let musicOn = true, musicGain = null, musicTimer = null, nextT = 0, step = 0, fast = false;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function mnote(m, t, dur, type, vol) {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = midi(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule() {
    const c = ac();
    const eighth = 60 / (fast ? 140 : 112) / 2;   // lebih cepat saat waktu pelanggan hampir habis
    while (nextT < c.currentTime + 0.25) {
      const bar = Math.floor(step / 8), i = step % 8;
      const mel = MELODY[bar % MELODY.length][i];
      if (mel) mnote(mel, nextT, eighth * 1.6, 'triangle', .05);
      const b = BASS_PATTERN[i];
      if (b !== null) mnote(BASS[bar % 4] + b, nextT, eighth * .9, 'sine', .09);
      if (i % 2 === 1) CHORDS[bar % 4].forEach(m => mnote(m, nextT, eighth * .5, 'sine', .018));
      nextT += eighth; step++;
    }
  }
  function startMusic() {
    if (!musicOn || musicTimer) return;
    try {
      const c = ac();
      if (!musicGain) { musicGain = c.createGain(); musicGain.gain.value = .8; musicGain.connect(c.destination); }
      nextT = c.currentTime + .05;
      schedule();
      musicTimer = setInterval(schedule, 100);
    } catch (e) { /* browser belum izinkan audio */ }
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

  return {
    play(name, arg) { if (muted) return; try { sfx[name](arg); } catch (e) { /* browser belum izinkan audio */ } },
    toggle() { muted = !muted; return muted; },
    get muted() { return muted; },
    startMusic,
    toggleMusic(on = !musicOn) { musicOn = on; if (musicOn) startMusic(); else stopMusic(); return musicOn; },
    get musicOn() { return musicOn; },
    setFast(v) { fast = v; },
  };
})();

const SPEAKER_ON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const SPEAKER_OFF = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const MUSIC_ON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V5l11-2v12.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="3"/><circle cx="17.5" cy="15.5" r="3"/></svg>`;
const MUSIC_OFF = MUSIC_ON.replace('</svg>', '<path d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>');
function savePref(k, v) { try { localStorage.setItem('tokoBenang.' + k, v ? '1' : '0'); } catch (e) { /* abaikan */ } }
function loadPref(k) { try { return localStorage.getItem('tokoBenang.' + k) !== '0'; } catch (e) { return true; } }
function toggleMute() { const m = Sound.toggle(); savePref('sfx', !m); $('#muteBtn').innerHTML = m ? SPEAKER_OFF : SPEAKER_ON; Sound.play('click'); }

// ================== GAMBAR BENANG (gaya lembut, tanpa garis tepi) ==================
//   Katun       = bola rapi dengan lilitan halus
//   Wol         = bola berbulu (pinggiran bergelombang), lilitan tebal
//   Akrilik     = gulungan lonjong (skein) dengan label kertas di tengah
//   Milk Cotton = gulungan tabung ("cake") dengan label kertas
let yarnUid = 0;
// f < 0 = lebih gelap, f > 0 = lebih terang
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, q = Math.abs(f);
  r = Math.round((t - r) * q + r); g = Math.round((t - g) * q + g); b = Math.round((t - b) * q + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const pastel = c => shade(c, .18);
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11) > 200; };
// Lingkaran bergelombang (pinggiran wol)
function bumpy(cx, cy, r, n, amp) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = i / n * 2 * Math.PI, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if (i === 0) { d += `M${x.toFixed(1)} ${y.toFixed(1)}`; continue; }
    const am = (i - .5) / n * 2 * Math.PI;
    d += ` Q${(cx + (r + amp) * Math.cos(am)).toFixed(1)} ${(cy + (r + amp) * Math.sin(am)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d + 'Z';
}
// Lilitan benang: garis lengkung sejajar yang diputar
function wraps(cx, cy, r, ang, n, col, sw, op) {
  let s = '';
  for (let k = 0; k < n; k++) {
    const t = -r + 2 * r * (k + .5) / n;
    s += `<path d="M${cx - r - 6} ${cy + t} Q${cx} ${cy + t - r * .5} ${cx + r + 6} ${cy + t}"/>`;
  }
  return `<g transform="rotate(${ang} ${cx} ${cy})" stroke="${col}" stroke-width="${sw}" opacity="${op}" fill="none" stroke-linecap="round">${s}</g>`;
}

function yarnSVG(it, cls = '') {
  const id = 'yc' + (yarnUid++);
  const C = it.hex, P = pastel(C);
  // benang putih/krem: lilitannya pakai warna gelap tipis supaya tetap kelihatan
  const line = isLight(C) ? '#7a5c44' : '#fff';
  const lo = isLight(C) ? .22 : .45;
  let g;
  if (it.type === 'Katun' || it.type === 'Wol') {
    const wol = it.type === 'Wol';
    const shape = wol ? `<path d="${bumpy(50, 50, 33, 16, 5)}"/>` : `<circle cx="50" cy="50" r="36"/>`;
    g = `<ellipse cx="50" cy="92" rx="26" ry="4" fill="#7a5c4422"/>
      <path d="M72 74 q14 8 10 20" stroke="${P}" stroke-width="${wol ? 6 : 4}" fill="none" stroke-linecap="round"/>
      <clipPath id="${id}">${shape}</clipPath>
      <g clip-path="url(#${id})">
        <rect width="100" height="100" fill="${P}"/>
        <circle cx="62" cy="64" r="34" fill="${shade(C, -.08)}" opacity=".45"/>
        ${wraps(50, 50, 38, -28, wol ? 4 : 7, line, wol ? 6 : 2.6, lo)}
        ${wraps(50, 50, 38, 58, wol ? 3 : 4, line, wol ? 5 : 2.2, lo * .7)}
        <circle cx="36" cy="34" r="9" fill="#fff" opacity=".5"/>
      </g>`;
  } else if (it.type === 'Akrilik') {
    const lobes = `<ellipse cx="29" cy="50" rx="25" ry="21"/><ellipse cx="71" cy="50" rx="25" ry="21"/>`;
    g = `<ellipse cx="50" cy="88" rx="38" ry="4" fill="#7a5c4422"/>
      <clipPath id="${id}">${lobes}</clipPath>
      <g clip-path="url(#${id})">
        <rect width="100" height="100" fill="${P}"/>
        <rect y="56" width="100" height="40" fill="${shade(C, -.08)}" opacity=".45"/>
        <g stroke="${line}" stroke-width="3" opacity="${lo}">${range(-14, 110, 8).map(x => `<path d="M${x} 26 L${x + 16} 76"/>`).join('')}</g>
        <ellipse cx="20" cy="40" rx="8" ry="4" fill="#fff" opacity=".55" transform="rotate(-25 20 40)"/>
      </g>
      <rect x="39" y="27" width="22" height="46" rx="8" fill="#fff"/>
      <rect x="39" y="45" width="22" height="9" fill="${P}"/>
      <circle cx="50" cy="36" r="3" fill="${P}"/>`;
  } else { // Milk Cotton
    g = `<ellipse cx="50" cy="90" rx="30" ry="4" fill="#7a5c4422"/>
      <rect x="22" y="26" width="56" height="58" rx="14" fill="${P}"/>
      <rect x="58" y="30" width="18" height="50" rx="9" fill="${shade(C, -.08)}" opacity=".4"/>
      <g stroke="${line}" stroke-width="2" opacity="${lo * .8}">${range(40, 80, 5).map(y => `<path d="M24 ${y} L76 ${y}"/>`).join('')}</g>
      <rect x="22" y="50" width="56" height="16" fill="#fff"/>
      <text x="50" y="62" font-size="9" text-anchor="middle" font-weight="600" fill="${isLight(C) ? '#8a6d50' : shade(C, -.1)}" font-family="Fredoka, sans-serif">milk</text>
      <ellipse cx="50" cy="30" rx="27" ry="8" fill="${shade(C, .35)}"/>
      <g fill="none" stroke="${line}" stroke-width="1.6" opacity="${lo * 1.2}">${[19, 12].map(r => `<ellipse cx="50" cy="30" rx="${r}" ry="${r * 8 / 27}"/>`).join('')}</g>`;
  }
  return `<svg class="yarn ${cls}" viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

// ================== GAMBAR HAKPEN ==================
// Tiap ukuran punya warna sendiri (HOOK_COLORS) di pegangannya; aluminium batangnya juga berwarna,
// bambu batangnya kayu beruas. Batang makin tebal kalau ukurannya makin besar.
function hookSVG(it, cls = '') {
  const metal = it.material === 'Aluminium';
  const sc = HOOK_COLORS[it.size];
  const rod = metal ? shade(sc, .45) : '#e6c391';
  const w = 3 + it.size * 1.7, x0 = 50 - w / 2, x1 = 50 + w / 2;
  const nodes = metal ? '' : [30, 80].map(y => `<rect x="${x0}" y="${y}" width="${w}" height="2" fill="#c49a5e"/>`).join('');
  return `<svg class="yarn ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="54" cy="92" rx="22" ry="3.5" fill="#7a5c4422"/>
    <g transform="rotate(35 50 50)">
      <path d="M${x0} 92 L${x0} 14 Q${x0} 6 50 6 Q${x1 + 3} 6 ${x1 + 3} 11 L${x1} 14 L50 17 L${x1} 20 L${x1} 92 Q50 98 ${x0} 92 Z" fill="${rod}"/>
      <rect x="${x0 + 1.2}" y="22" width="${w * .3}" height="66" rx="2" fill="#fff" opacity=".7"/>
      ${nodes}
      <rect x="${Math.min(x0 - 6, 38)}" y="42" width="${Math.max(w + 12, 24)}" height="30" rx="12" fill="${sc}"/>
      <text x="50" y="63" text-anchor="middle" font-size="17" font-weight="500" fill="#fff" font-family="Fredoka, sans-serif">${it.size}</text>
    </g></svg>`;
}
// Nama dengan "badge" ukuran berwarna untuk hakpen (dipakai di balon chat, zoom, kasir)
const itemLabel = it => it.kind === 'hook'
  ? `Hakpen ${it.material} <span class="mm" style="--c:${HOOK_COLORS[it.size]}">${it.size} mm</span>`
  : itemName(it);
const itemSVG = (it, cls = '') => it.kind === 'hook' ? hookSVG(it, cls) : yarnSVG(it, cls);

// ================== GAMBAR PELANGGAN ==================
// mood: happy | neutral | sad | angry | delighted
function randomLook() {
  return { skin: pick(SKINS), hair: pick(HAIRS), style: pick(STYLES), shirt: pick(SHIRTS), scarf: pick(SHIRTS), glasses: Math.random() < .25 };
}

// Gaya lembut: tanpa garis tepi, kepala langsung menempel ke bahu (tanpa leher)
function customerSVG(p, mood, vip = false) {
  const ink = '#4a3426', sk = p.skin, skD = shade(sk, -.1), hr = p.hair, brow = shade(hr, -.1);
  const shirt = pastel(p.shirt), scarf = pastel(p.scarf);
  let s = '';
  if (p.style === 'bun') s += `<circle cx="80" cy="19" r="15" fill="${hr}"/>`;
  s += `<path d="M16 176 Q18 110 80 98 Q142 110 144 176 Z" fill="${shirt}"/>`;
  if (p.style === 'hijab') {
    s += `<path d="M38 66 Q38 16 80 16 Q122 16 122 66 Q124 100 136 130 Q80 148 24 130 Q36 100 38 66 Z" fill="${scarf}"/>`;
    s += `<path d="M38 66 Q38 16 80 16 Q122 16 122 66 Q124 100 136 130 Q80 148 24 130 Q36 100 38 66 Z" fill="#7a5c44" opacity=".07"/>`;
  } else {

  s += `<g fill="${p.style === 'hijab' ? scarf : hr}">${front[p.style]}</g>`;
  if (p.style !== 'curly') s += `<path d="M58 32 Q68 26 80 26" stroke="#fff" opacity=".3" stroke-width="4" fill="none" stroke-linecap="round"/>`;

  const eye = x => `<ellipse cx="${x}" cy="67" rx="3.6" ry="4.6" fill="${ink}"/><circle cx="${x + 1.2}" cy="65.6" r="1.2" fill="#fff"/>`;
  const ln = (d, w = 3, col = ink) => `<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const blush = o => `<ellipse cx="60" cy="80" rx="7" ry="3.5" fill="#ff8fa3" opacity="${o}"/><ellipse cx="100" cy="80" rx="7" ry="3.5" fill="#ff8fa3" opacity="${o}"/>`;
  const nose = ln('M80 70 Q77 78 82 78', 2.4, shade(sk, -.3));
  const smileEyes = ln('M61 68 Q66 63 71 68', 2.8) + ln('M89 68 Q94 63 99 68', 2.8);

      + `<ellipse cx="60" cy="80" rx="8" ry="4" fill="#ff5d5d" opacity=".3"/><ellipse cx="100" cy="80" rx="8" ry="4" fill="#ff5d5d" opacity=".3"/>`
      + ln('M72 90 Q80 84 88 90', 2.8)
      + `<g stroke="#ff5d73" stroke-width="3" fill="none" stroke-linecap="round"><path d="M114 30 q4 4 0 8"/><path d="M124 30 q-4 4 0 8"/><path d="M115 29 q4 4 8 0"/><path d="M115 39 q4 -4 8 0"/></g>`;

}

function floatScore(pts) {
  const pill = $('#scorePill');
  const f = document.createElement('span');
  f.className = 'float';

  setTimeout(() => f.remove(), 1300);

  const el = $('#score'), from = S.shownScore, to = S.score, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 700);

    if (k < 1) requestAnimationFrame(step); else S.shownScore = to;
  };

// ================== STATE & ALUR GAME ==================
let S = null;

function newGame() {
  Sound.play('click');
  Sound.startMusic();
  S = { lvl: 0, score: 0, shownScore: 0, log: [], phase: 'idle', combo: 0 };
  $('#score').textContent = 0;
  startLevel();
}

function startLevel() {
  const L = LEVELS[S.lvl];
  // Semua kombinasi jenis × warna, diacak, lalu dibagi ke rak & tingkat
  const pool = [];
  for (let t = 0; t < L.types; t++) {
    for (const [color, hex] of COLORS) {
      pool.push({ kind: 'yarn', color, hex, type: TYPES[t].name, price: TYPES[t].price + pick([0, 0, 500, 1000]) });
    }
  }
  shuffle(pool);
  S.racks = [];
  let k = 0;
  for (let r = 0; r < L.racks; r++) {
    const shelves = [];
    for (let s = 0; s < L.shelves; s++) {
      const items = [];
      for (let i = 0; i < L.perShelf; i++) items.push(pool[k++]);
      shelves.push(items);
    }
    S.racks.push({ kind: 'yarn', shelves });
  }
  S.items = pool.slice(0, k);
  // Papan hakpen, diselipkan di posisi acak di antara rak benang
  S.hooks = shuffle(HOOK_MATERIALS.flatMap(m => HOOK_SIZES.map(size =>
    ({ kind: 'hook', material: m.name, size, price: m.price + size * 500 })))).slice(0, L.hooks);
  const hookShelves = [];
  for (let i = 0; i < S.hooks.length; i += L.perShelf) hookShelves.push(S.hooks.slice(i, i + L.perShelf));
  S.racks.splice(randInt(0, S.racks.length), 0, { kind: 'hook', shelves: hookShelves });
  S.used = new Set();
  S.cust = 0;
  S.phase = 'idle';
  S.view = 'racks';
  S.freshLayout = true;
  S.tab = 0;
  updateHud();
  customerGone();
  render();
  Sound.play('level');
  const prev = S.lvl > 0 ? `<p>Level ${S.lvl} selesai! Skor sementara <b>${S.score}</b>.</p>` : '';
  showOverlay(`
    ${prev}
    <h2>Level ${S.lvl + 1}</h2>
    <p>${L.racks} rak benang (<b>${L.racks * L.shelves * L.perShelf}</b> gulung) + papan <b>${L.hooks}</b> hakpen.<br>
       Semua posisi sudah <b>diacak ulang</b>, jadi ingat-ingat ya!</p>
    <p>Tiap pelanggan minta <b>${L.minItems === L.maxItems ? L.minItems : L.minItems + '–' + L.maxItems}</b> barang.</p>
    <div class="btns"><button class="btn go" onclick="hideOverlay(); nextCustomer()">Buka Toko</button></div>`);
}

function nextCustomer() {
  const L = LEVELS[S.lvl];
  if (S.cust >= L.customers) {
    customerGone();
    if (S.lvl + 1 < LEVELS.length) { S.lvl++; startLevel(); } else endGame();
    return;
  }
  S.cust++;
  // Pilih barang yang belum pernah diminta di level ini (kalau habis, boleh ulang)
  const n = randInt(L.minItems, L.maxItems);
  const order = [];
  const choose = list => {
    let c = list.filter(i => !S.used.has(i) && !order.includes(i));
    if (!c.length) c = list.filter(i => !order.includes(i));
    order.push(pick(c));
  };
  if (Math.random() < L.hookChance) choose(S.hooks);
  while (order.length < n) choose(S.items);
  shuffle(order);
  order.forEach(i => S.used.add(i));
  const total = sum(order.map(i => i.price));
  const vip = S.cust > 1 && Math.random() < VIP.chance;
  const time = Math.round((L.time + (n - 1) * TIME_PER_EXTRA) * (vip ? VIP.timeFactor : 1));
  S.c = { look: randomLook(), order, found: new Set(), total, paid: paymentFor(total), vip,
          timeLeft: time, total_time: time, override: null, drawnMood: null, lastSec: null };
  S.tray = [];
  S.view = 'racks';
  render();
  updateHud();

  // pelanggan masuk
  S.phase = 'entering';
  $('#closedSign').style.display = 'none';
  drawCustomer();
  const w = $('#custWrap');
  w.className = ''; void w.offsetWidth; w.className = 'enter';
  $('#bubble').classList.remove('show');
  renderTimer();
  Sound.play('bell');
  if (vip) setTimeout(() => Sound.play('vip'), 300);
  $('#bubble').classList.toggle('vip', vip);
  setTimeout(() => {
    renderRequest();
    restartAnim($('#bubble'), 'show');
    say('');
    S.phase = 'serve';
  }, 650);
}

function customerGone() {
  $('#customer').innerHTML = '';
  $('#custWrap').className = '';
  $('#bubble').classList.remove('show');
  $('#closedSign').style.display = '';
  $('#timerFill').style.width = '100%';
  $('#timerFill').style.background = '#ffffff55';
  $('#timerFill').classList.remove('low');
  $('#timerText').innerHTML = '&nbsp;';
}

function customerLeave(then) {
  $('#bubble').classList.remove('show');
  const w = $('#custWrap');
  w.className = ''; void w.offsetWidth; w.className = 'leave';
  setTimeout(then, 520);
}

// ================== PELANGGAN, MOOD & TIMER ==================
function currentMood() {
  const c = S.c;
  if (c.override && performance.now() < c.override.until) return c.override.mood;
  if (c.timeLeft <= 0) return 'angry';
  return c.timeLeft / c.total_time > 0.5 ? 'happy' : 'neutral';
}

function setMood(mood, ms = 1500) { S.c.override = { mood, until: performance.now() + ms }; drawCustomer(); }

function drawCustomer() {
  const m = currentMood();
  if (m === S.c.drawnMood) return;
  S.c.drawnMood = m;
  $('#customer').innerHTML = customerSVG(S.c.look, m, S.c.vip);
}

function renderRequest() {
  const c = S.c;
  $('#request').innerHTML = `${c.vip ? '<div class="vipTag">PELANGGAN VIP · poin x2 · waktu lebih singkat</div>' : ''}Kak, saya mau beli:
    <ul class="order">${c.order.map(it =>
      `<li class="${c.found.has(it) ? 'done' : ''}">${itemSVG(it)}<span>${itemLabel(it)}</span>${CHECK_SVG}</li>`).join('')}</ul>`;
}

function say(text, good = false) {
  $('#reply').textContent = text;
  $('#reply').className = good ? 'good' : '';
}

function renderTimer() {
  const c = S.c;
  const ratio = Math.max(0, c.timeLeft) / c.total_time;
  const fill = $('#timerFill');
  fill.style.width = (ratio * 100) + '%';
  if (c.timeLeft <= 0) {
    fill.style.width = '100%';
    fill.style.background = '#e03131';
    $('#timerText').textContent = 'Telat! Pelanggan sebel';
  } else {
    fill.style.background = ratio > 0.5 ? '#5cc46a' : ratio > 0.25 ? '#f2b632' : '#f07a3a';
    $('#timerText').textContent = Math.ceil(c.timeLeft) + ' detik';
  }
  fill.classList.toggle('low', c.timeLeft > 0 && c.timeLeft <= 10);
}

setInterval(() => {
  if (!S || S.phase !== 'serve') return;
  const c = S.c, before = c.timeLeft;
  c.timeLeft -= 0.1;
  const sec = Math.ceil(c.timeLeft);
  if (sec !== c.lastSec) {
    c.lastSec = sec;
    if (sec > 0 && sec <= 10) Sound.play('tick');
  }
  if (before > 0 && c.timeLeft <= 0) {
    Sound.play('angry');
    restartAnim($('#custWrap'), 'shake');
    say('Lama banget sih, kak…');
  }
  renderTimer();
  drawCustomer();
  Sound.setFast(c.timeLeft > 0 && c.timeLeft <= 10);
}, 100);

// Hitung ukuran benang terbesar yang masih muat (lebar & tinggi) tanpa scroll
// Coba susunan 1 baris, 2 baris, dst., lalu pilih yang benangnya paling besar
function fitRacks() {
  const view = $('#view');
  if (!S || !view.classList.contains('racks')) return;
  const tabbed = view.classList.contains('tabbed');
  const L = LEVELS[S.lvl], nR = tabbed ? 1 : S.racks.length;
  const shelves = tabbed ? S.racks[S.tab].shelves.length : L.shelves;
  const W = view.clientWidth, H = view.clientHeight;
  let best = null;
  for (let rows = 1; rows <= nR; rows++) {
    const cols = Math.ceil(nR / rows);
    const rackW = (W - 8 * (cols - 1)) / cols;
    const rackH = (H - 8 * (rows - 1)) / rows;
    const fs = Math.max(9, Math.min(12, rackW / 14));
    const byW = (rackW - 12 - 6) / L.perShelf - 8;
    const shelfH = (rackH - 12 - 6 - 20 - 6 * shelves) / shelves; // padding rak, bayangan, judul, jarak
    const byH = shelfH - 4 - 6 - 4 - fs * 1.2;                         // padding tingkat, papan, item, label
    const ys = Math.min(nR === 1 ? 80 : 64, byW, byH);
    if (!best || ys > best.ys) best = { ys, cols, fs };
  }
  // Layar terlalu kecil (HP): daripada benang jadi mungil, pakai kolom yang wajar dan boleh scroll
  view.style.overflowY = 'hidden';
  if (best.ys < 28 && nR > 1) {
    const cols = Math.max(2, Math.floor(W / 150));
    const rackW = (W - 8 * (cols - 1)) / cols;
    best = { cols, fs: 11, ys: Math.min(52, (rackW - 18) / L.perShelf - 8) };
    view.style.overflowY = 'auto';
  }
  view.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, 1fr))`;
  view.style.setProperty('--ys', best.ys + 'px');
  view.style.setProperty('--fs', best.fs + 'px');
}
// Hitung ulang setiap kali ukuran area rak berubah (resize, balon chat muncul, dll.)
new ResizeObserver(() => fitRacks()).observe($('#view'));

function zoom(r, s, i) {
  if (S.phase !== 'serve') return;
  const it = S.racks[r].shelves[s][i];
  Sound.play('wow');
  showOverlay(`
    <div class="zoomStage"><div class="rays"></div>${itemSVG(it)}<div class="wowTag">WOW!</div></div>
    <h2>${it.kind === 'hook' ? '' : 'Benang '}${itemLabel(it)}</h2>
    <div class="price">${rp(it.price)}</div>
    <div class="btns">
      <button class="btn ghost" onclick="Sound.play('click'); hideOverlay()">Taruh lagi</button>
      <button class="btn go" onclick="give(${r}, ${s}, ${i})">Kasih ke pelanggan</button>
    </div>`);
}

function give(r, s, i) {
  hideOverlay();
  const c = S.c, it = S.racks[r].shelves[s][i];
  if (!c.order.includes(it)) {
    Sound.play('wrong');
    setMood('sad');
    restartAnim($('#custWrap'), 'shake');
    say('Bukan yang ini, kak…');
    return;
  }
  if (c.found.has(it)) {
    Sound.play('wrong');
    say('Yang itu sudah, kak.');
    return;
  }
  c.found.add(it);
  Sound.play('collect');
  setMood('delighted', 900);
  renderRequest();
  const left = c.order.length - c.found.size;
  if (left > 0) { say(`Sip! Kurang ${left} lagi ya.`, true); return; }
  say(`Lengkap! Ini uangnya ${rp(c.paid)}.`, true);
  setTimeout(() => { if (S.phase === 'serve') { S.view = 'pay'; S.tray = []; render(); Sound.play('note'); } }, 600);
}

// ================== KASIR ==================
function renderPay() {
  const c = S.c, given = sum(S.tray);
  $('#view').innerHTML = `
    <div class="register${S.payFresh ? ' fresh' : ''}">
      <div class="lcd">
        <div><span>TOTAL</span><b>${rp(c.total)}</b></div>
        <div><span>DIBAYAR</span><b>${rp(c.paid)}</b></div>
        <div class="hl"><span>KEMBALIAN</span><b>${rp(given)}</b></div>
      </div>
      <div class="paidRow">
        <div class="bought">${c.order.map(it => `<div>${itemSVG(it)}${itemLabel(it)} <b>${rp(it.price)}</b></div>`).join('')}</div>
        ${moneyHTML(c.paid, 'div', S.payFresh ? 'handover' : '')}
      </div>
      <div class="label">Kembalian untuk pelanggan (klik uang di sini untuk ambil lagi)</div>
      <div class="tray">${S.tray.map((v, i) =>
        moneyHTML(v, 'button', i === S.justAdded ? 'drop' : '', `onclick="removeNote(${i})"`)).join('')}</div>
      <div class="cashDrawer">${CHANGE_NOTES.map(v => moneyHTML(v, 'button', '', `onclick="addNote(${v})"`)).join('')}</div>
      <div class="payActions">
        <button class="btn ghost" onclick="clearTray()">Kosongkan</button>
        <button class="btn go" onclick="submitChange()">Serahkan Kembalian</button>
      </div>
    </div>`;
  S.payFresh = false;
  S.justAdded = -1;
}

function addNote(v) { S.tray.push(v); S.justAdded = S.tray.length - 1; Sound.play(MONEY[v].kind === 'coin' ? 'coin' : 'note'); renderPay(); }
function removeNote(i) { S.tray.splice(i, 1); Sound.play('remove'); renderPay(); }
function clearTray() { S.tray = []; Sound.play('remove'); renderPay(); }

function submitChange() {
  if (S.phase !== 'serve') return;
  const c = S.c;
  S.phase = 'result';
  const due = c.paid - c.total;
  const given = sum(S.tray);
  const correct = given === due;
  const late = c.timeLeft <= 0;
  const status = !correct ? 'bad' : late ? 'late' : 'ok';
  S.combo = status === 'ok' ? S.combo + 1 : 0;
  const comboMult = status === 'ok' ? Math.min(COMBO.max, 1 + COMBO.step * (S.combo - 1)) : 1;
  const vipMult = c.vip && correct ? VIP.mult : 1;
  const base = !correct ? SCORE.wrongChange
             : late ? SCORE.late
             : SCORE.onTimeBase + Math.ceil(c.timeLeft) * SCORE.perSecondLeft;
  const pts = Math.round(base * comboMult * vipMult);
  S.score += pts;
  S.log.push({ lvl: S.lvl + 1, items: c.order.map(itemName).join(', '), status, pts, vip: c.vip });

  if (status === 'ok') { Sound.play('success'); setMood('delighted', 1e9); confetti(); say('Makasih, kak! Mantap!', true); }
  else if (status === 'late') { Sound.play('success'); setMood('neutral', 1e9); say('Iya deh, makasih… lama juga ya.'); }
  else { Sound.play('fail'); setMood('angry', 1e9); restartAnim($('#custWrap'), 'shake'); say('Lho, kembaliannya kok gini?'); }
  if (pts > 0) floatScore(pts);
  if (comboMult > 1) setTimeout(() => Sound.play('combo', S.combo), 450);
  updateHud();
  const badges = [comboMult > 1 ? `<span class="badge combo">COMBO ${S.combo} · x${comboMult}</span>` : '',
                  vipMult > 1 ? `<span class="badge vip">VIP x${vipMult}</span>` : ''].join('');

  const title = { ok: 'BERHASIL!', late: 'TELAT', bad: 'SALAH HITUNG' }[status];
  $('#hint').textContent = '';
  $('#view').className = '';
  $('#view').innerHTML = `
    <div class="result ${status}">
      <div class="stamp">${title}</div>
      <p>Kembalian seharusnya <b>${rp(due)}</b>, kamu kasih <b>${rp(given)}</b>.</p>
      ${badges ? `<div class="badges">${badges}</div>` : ''}
      <div class="pts">+${pts}</div>
      <button class="btn go" onclick="Sound.play('click'); customerLeave(nextCustomer)">Lanjut</button>
    </div>`;
}

// ================== HUD & AKHIR GAME ==================
function updateHud() {
  $('#lvl').textContent = `${S.lvl + 1}/${LEVELS.length}`;
  $('#cust').textContent = `${S.cust}/${LEVELS[S.lvl].customers}`;
  if (S.shownScore === S.score) $('#score').textContent = S.score;
  $('#comboPill').hidden = S.combo < 2;
  $('#combo').textContent = S.combo;
  if (S.combo >= 2) restartAnim($('#comboPill'), 'bump');
}

const STAR = on => `<svg class="star ${on ? 'on' : ''}" viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>`;

function endGame() {
  S.phase = 'idle';
  $('#closedSign').textContent = 'Toko tutup. Terima kasih!';
  $('#view').innerHTML = '';
  $('#hint').textContent = '';
  Sound.play('end');
  const ok = S.log.filter(l => l.status === 'ok').length;
  const ratio = ok / S.log.length;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio >= .3 ? 1 : 0;
  const tagText = { ok: 'Berhasil', late: 'Telat', bad: 'Salah hitung' };
  const best = getBest();
  const isRecord = S.score > best;
  if (isRecord) { setBest(S.score); setTimeout(() => Sound.play('record'), 1100); }
  showOverlay(`
    <h2>Toko Tutup!</h2>
    <div class="stars">${[0, 1, 2].map(i => STAR(i < stars).replace('class="star on"', `class="star on" style="animation-delay:${.2 + i * .25}s"`)).join('')}</div>
    <div class="final">${S.score} poin</div>
    ${isRecord ? '<div class="newRecord">REKOR BARU!</div>' : `<div class="best">Rekor kamu: ${best} poin</div>`}
    <p>${ok} dari ${S.log.length} pelanggan puas.</p>
    <div class="log">${S.log.map(l =>
      `<div><span>Lv${l.lvl} · ${l.vip ? '<b>VIP</b> · ' : ''}${l.items}</span><span class="tag ${l.status}">${tagText[l.status]} +${l.pts}</span></div>`).join('')}</div>
    <div class="btns"><button class="btn go" onclick="$('#closedSign').textContent = 'Menunggu pelanggan…'; newGame()">Main Lagi</button></div>`);
}

function getBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* abaikan */ } }

// ================== MULAI ==================
if (!loadPref('sfx')) Sound.toggle();
Sound.toggleMusic(loadPref('music'));
$('#muteBtn').innerHTML = Sound.muted ? SPEAKER_OFF : SPEAKER_ON;
$('#musicBtn').innerHTML = Sound.musicOn ? MUSIC_ON : MUSIC_OFF;
$('#logo').innerHTML = yarnSVG({ type: 'Wol', hex: '#f07fb0' }) + '<span>Toko Benang</span>';
showOverlay(`
  ${yarnSVG({ type: 'Wol', hex: '#f07fb0' }, 'bigLogo')}
  <h2>Toko Benang Rajut</h2>
  <p>Pelanggan datang minta <b>1–3 barang</b>: benang dan hakpen. Cari di rak, lalu klik barangnya.</p>
  <p>Setelah lengkap, hitung <b>kembaliannya</b> dengan klik uang. Cepat &amp; tepat = skor maksimal!</p>
  <p>Isi rak diacak setiap level, jadi ingat-ingat posisinya. Sukses beruntun = <b>COMBO</b>, pelanggan bermahkota = <b>VIP poin x2</b>!</p>
  <div class="legend">${TYPES.map(t => `<div>${yarnSVG({ type: t.name, hex: '#b9a48a' })}${t.name}</div>`).join('')}
    <div>${hookSVG({ material: 'Aluminium', size: 4 })}Hakpen</div></div>
  ${getBest() ? `<div class="best">Rekor kamu: ${getBest()} poin</div>` : ''}
  <div class="btns"><button class="btn go" onclick="newGame()">Mulai</button></div>`);
</script>
</body>
</html>
